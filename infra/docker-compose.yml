# One-command local env (PLAN.md): LocalStack + OpenSearch + scene retrieval.
# Network is named `localstack` so `sam local start-api --docker-network localstack`
# can reach these services by hostname.
#
#   cd infra && ./up.sh
#   # or: docker compose up --wait

services:
  localstack:
    image: localstack/localstack:3.8
    hostname: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=lambda,apigateway,iam,sts,logs
      - DEBUG=0
    volumes:
      - "./localstack-data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - localstack

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    hostname: opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - localstack

  retrieve:
    image: python:3.12-slim
    hostname: retrieve
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
      - RETRIEVE_PORT=8081
    volumes:
      - ..:/workspace:ro
    working_dir: /workspace
    command: python infra/scripts/retrieve_server.py
    ports:
      - "8081:8081"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - localstack

networks:
  localstack:
    name: localstack
